# Publishes a GitHub release when a version tag is pushed, e.g. `git push fork v0.11.0-fork`.
#
# Deliberately separate from build.yml: this job needs `contents: write` to create the
# release, and build.yml must stay `contents: read` so ordinary PR builds never run with a
# writable token.
#
# The tag is the single source of truth for the version. `-Drevision` and `-Dchangelist`
# override the properties in pom.xml, so the artifact version cannot drift from the tag
# and no -SNAPSHOT state is committed.
#
# Actions are pinned to a full commit SHA with the release tag in a trailing comment; see
# build.yml for why.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          mvn -B -ntp -s ci/settings.xml \
            -Drevision='${{ steps.version.outputs.version }}' -Dchangelist= \
            clean verify

      - name: Name the artifact after the version
        run: cp target/nomad.hpi 'nomad-${{ steps.version.outputs.version }}.hpi'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            'nomad-${{ steps.version.outputs.version }}.hpi'
